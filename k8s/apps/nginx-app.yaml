apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd
spec:
  project: default

source:
  repoURL: https://github.com/LemanskiM/DevOps-toolbox.git
  targetRevision: main
  path: k8s/workloads/nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true